<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — DataLake</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family: var(--font-ui); background: var(--bg-subtle); color: var(--text); font-size:15px; line-height:1.5; -webkit-font-smoothing: antialiased; min-height:100vh; display:flex; flex-direction:column; }
a{ color: inherit; text-decoration:none; }
button, input{ font-family: inherit; }
svg{ display:block; }
:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

.top{ height:64px; padding: 0 28px; display:flex; align-items:center; justify-content:space-between; }
.logo{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; letter-spacing:-0.02em; }
.logo-mark{ width:22px; display:flex; flex-direction:column; gap:3px; }
.logo-mark span{ height:4px; border-radius:1px; display:block; }
.logo-mark span:nth-child(1){ background: var(--bronze); }
.logo-mark span:nth-child(2){ background: var(--silver); margin-left:3px; }
.logo-mark span:nth-child(3){ background: var(--accent); margin-left:6px; }
.top-right{ display:flex; align-items:center; gap:14px; font-size:14px; color: var(--text-muted); }
.top-right a:hover{ color: var(--text); }

.wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding: 24px 16px 64px; }
.card{ width:100%; max-width: 400px; }
.head{ text-align:center; margin-bottom: 28px; }
.head h1{ font-size: 28px; font-weight:600; letter-spacing:-0.03em; }
.head p{ margin-top:6px; color: var(--text-muted); }

.tabs{ display:grid; grid-template-columns: 1fr 1fr; gap:4px; padding:4px; background: var(--surface-3); border-radius: var(--radius); margin-bottom: 16px; }
.tab-btn{ height:34px; border:none; border-radius:6px; background:transparent; color: var(--text-muted); font-size:14px; font-weight:500; cursor:pointer; }
.tab-btn.active{ background: var(--surface); color: var(--text); box-shadow: var(--shadow-xs); }

.panel{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); }
.panel-body{ display:none; }
.panel-body.active{ display:block; }

.field{ margin-bottom: 16px; }
.field label{ display:block; font-size:14px; font-weight:500; margin-bottom:6px; }
.input-wrap{ position:relative; }
.field input{
  width:100%; height:42px; padding: 0 12px; border:1px solid var(--border-strong); border-radius: var(--radius);
  background: var(--surface); color: var(--text); font-size:15px; transition: border-color .15s, box-shadow .15s;
}
.field input::placeholder{ color: var(--text-faint); }
.field input:focus{ outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field input.has-toggle{ padding-right: 44px; }
.pw-toggle{ position:absolute; right:4px; top:4px; width:34px; height:34px; border:none; background:transparent; color: var(--text-faint); border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.pw-toggle:hover{ color: var(--text); background: var(--surface-3); }
.pw-toggle svg{ width:16px; height:16px; }
.hint{ font-size:13px; color: var(--text-faint); margin-top:6px; }
.remember{ display:flex; align-items:center; gap:8px; font-size:14px; color: var(--text-muted); margin: 2px 0 18px; cursor:pointer; }
.remember input{ width:16px; height:16px; accent-color: var(--accent); }

.btn{ width:100%; height:42px; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius: var(--radius); background: var(--text); color: var(--on-text); font-size:15px; font-weight:500; cursor:pointer; transition: opacity .15s; }
.btn:hover{ opacity:.86; }
.btn:disabled{ opacity:.55; cursor:default; }
.spinner{ width:14px; height:14px; border-radius:50%; border:2px solid currentColor; border-top-color: transparent; opacity:.7; animation: spin .6s linear infinite; display:none; }
.btn.loading .spinner{ display:inline-block; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.form-msg{ display:none; align-items:flex-start; gap:8px; padding: 10px 12px; border-radius: var(--radius); font-size:14px; margin-bottom:16px; }
.form-msg.show{ display:flex; }
.form-msg.error{ background: var(--red-dim); color: var(--red); }
.form-msg.success{ background: var(--green-dim); color: var(--green); }
.form-msg svg{ width:16px; height:16px; flex-shrink:0; margin-top:1px; }

.foot{ text-align:center; margin-top: 18px; font-size:14px; color: var(--text-muted); }
.foot a{ color: var(--text); font-weight:500; }
.foot a:hover{ color: var(--accent); }
.api-note{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top: 12px; font-size:13px; color: var(--text-faint); }
.api-note i{ width:7px; height:7px; border-radius:50%; background: var(--text-faint); display:block; }
.api-note.up i{ background: var(--green); }
.api-note.down i{ background: var(--red); }
</style>
</head>
<body>

<header class="top">
  <a href="index.html" class="logo" aria-label="DataLake home"><span class="logo-mark"><span></span><span></span><span></span></span>DataLake</a>
  <div class="top-right">
    <a href="index.html">Home</a>
    <span data-theme-menu></span>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <div class="head">
      <h1 id="authTitle">Welcome back</h1>
      <p id="authSubtitle">Sign in to your lakehouse workspace</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" id="tabLogin" type="button" role="tab" aria-selected="true">Sign in</button>
      <button class="tab-btn" id="tabRegister" type="button" role="tab" aria-selected="false">Create account</button>
    </div>

    <div class="panel">
      <div id="formMsg" class="form-msg" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span id="formMsgText"></span>
      </div>

      <div class="panel-body active" id="panelLogin">
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="loginUsername">Username</label>
            <input type="text" id="loginUsername" name="username" placeholder="your_username" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <div class="input-wrap">
              <input type="password" id="loginPassword" name="password" class="has-toggle" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" class="pw-toggle" data-target="loginPassword" aria-label="Show password"></button>
            </div>
          </div>
          <label class="remember"><input type="checkbox" id="rememberMe" checked /> Keep me signed in on this device</label>
          <button type="submit" class="btn" id="loginSubmit"><span class="spinner"></span><span class="btn-label">Sign in</span></button>
        </form>
      </div>

      <div class="panel-body" id="panelRegister">
        <form id="registerForm" novalidate>
          <div class="field">
            <label for="regUsername">Username</label>
            <input type="text" id="regUsername" name="username" placeholder="your_username" autocomplete="username" minlength="3" maxlength="50" required />
            <div class="hint">3–50 characters</div>
          </div>
          <div class="field">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="regPassword">Password</label>
            <div class="input-wrap">
              <input type="password" id="regPassword" name="password" class="has-toggle" placeholder="••••••••" autocomplete="new-password" minlength="8" required />
              <button type="button" class="pw-toggle" data-target="regPassword" aria-label="Show password"></button>
            </div>
            <div class="hint">At least 8 characters</div>
          </div>
          <button type="submit" class="btn" id="registerSubmit"><span class="spinner"></span><span class="btn-label">Create account</span></button>
        </form>
      </div>
    </div>

    <div class="foot" id="switchFoot">Don’t have an account? <a href="#register" id="switchToRegister">Create one</a></div>
    <div class="api-note" id="apiNote"><i></i><span>Checking backend…</span></div>
  </div>
</main>

<script>
(function(){
  'use strict';
  var API_BASE = 'http://localhost:8000'; // FastAPI backend (uvicorn main:app --reload)

  var tabLogin = document.getElementById('tabLogin');
  var tabRegister = document.getElementById('tabRegister');
  var panelLogin = document.getElementById('panelLogin');
  var panelRegister = document.getElementById('panelRegister');
  var authTitle = document.getElementById('authTitle');
  var authSubtitle = document.getElementById('authSubtitle');
  var switchFoot = document.getElementById('switchFoot');
  var formMsg = document.getElementById('formMsg');
  var formMsgText = document.getElementById('formMsgText');

  // Already signed in? Go straight to the dashboard.
  if (localStorage.getItem('access_token') || sessionStorage.getItem('access_token')) {
    window.location.replace('dashboard.html');
    return;
  }

  function showTab(which){
    var isLogin = which === 'login';
    tabLogin.classList.toggle('active', isLogin);
    tabRegister.classList.toggle('active', !isLogin);
    tabLogin.setAttribute('aria-selected', isLogin ? 'true' : 'false');
    tabRegister.setAttribute('aria-selected', isLogin ? 'false' : 'true');
    panelLogin.classList.toggle('active', isLogin);
    panelRegister.classList.toggle('active', !isLogin);
    authTitle.textContent = isLogin ? 'Welcome back' : 'Create your account';
    authSubtitle.textContent = isLogin ? 'Sign in to your lakehouse workspace' : 'Start ingesting and querying your data';
    document.title = (isLogin ? 'Sign in' : 'Create account') + ' — DataLake';
    switchFoot.innerHTML = isLogin
      ? 'Don’t have an account? <a href="#register" id="switchToRegister">Create one</a>'
      : 'Already have an account? <a href="#login" id="switchToLogin">Sign in</a>';
    if (history.replaceState) history.replaceState(null, '', isLogin ? '#login' : '#register');
    hideMsg();
    bindSwitchLinks();
    (isLogin ? document.getElementById('loginUsername') : document.getElementById('regUsername')).focus();
  }

  function bindSwitchLinks(){
    var toReg = document.getElementById('switchToRegister');
    var toLogin = document.getElementById('switchToLogin');
    if (toReg) toReg.addEventListener('click', function(e){ e.preventDefault(); showTab('register'); });
    if (toLogin) toLogin.addEventListener('click', function(e){ e.preventDefault(); showTab('login'); });
  }

  tabLogin.addEventListener('click', function(){ showTab('login'); });
  tabRegister.addEventListener('click', function(){ showTab('register'); });
  bindSwitchLinks();
  if (location.hash === '#register') showTab('register');

  // Show / hide password
  var EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  document.querySelectorAll('.pw-toggle').forEach(function(b){
    b.innerHTML = EYE;
    b.addEventListener('click', function(){
      var input = document.getElementById(b.getAttribute('data-target'));
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      b.innerHTML = show ? EYE_OFF : EYE;
      b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  });

  function showMsg(text, type){ formMsgText.textContent = text; formMsg.className = 'form-msg show ' + type; }
  function hideMsg(){ formMsg.className = 'form-msg'; }
  function setLoading(btn, loading){ btn.classList.toggle('loading', loading); btn.disabled = loading; }

  function parseError(res, fallback){
    return res.json().catch(function(){ return null; }).then(function(body){
      if (body && body.detail){
        if (Array.isArray(body.detail)) return body.detail.map(function(d){ return d.msg; }).join(' ');
        return body.detail;
      }
      return fallback;
    });
  }
  function unreachable(){ return 'Could not reach the backend at ' + API_BASE + '. Start it with: uvicorn main:app --reload'; }

  function apiLogin(username, password, remember){
    if (!username || !password) return Promise.reject('Enter your username and password.');
    return fetch(API_BASE + '/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password, remember_me: !!remember })
    }).then(function(res){
      if (!res.ok) return parseError(res, 'Incorrect username or password.').then(function(msg){ throw msg; });
      return res.json();
    }).catch(function(err){ if (typeof err === 'string') throw err; throw unreachable(); });
  }

  function apiRegister(username, email, password){
    if (username.length < 3) return Promise.reject('Username must be at least 3 characters.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return Promise.reject('Enter a valid email address.');
    if (password.length < 8) return Promise.reject('Password must be at least 8 characters.');
    return fetch(API_BASE + '/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, email: email, password: password })
    }).then(function(res){
      if (!res.ok) return parseError(res, 'Could not create account.').then(function(msg){ throw msg; });
      return res.json();
    }).catch(function(err){ if (typeof err === 'string') throw err; throw unreachable(); });
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    hideMsg();
    var username = document.getElementById('loginUsername').value.trim();
    var password = document.getElementById('loginPassword').value;
    var remember = document.getElementById('rememberMe').checked;
    var btn = document.getElementById('loginSubmit');

    setLoading(btn, true);
    apiLogin(username, password, remember)
      .then(function(res){
        // "Keep me signed in" = localStorage (survives closing the browser) and a
        // 7-day token from the backend; unchecked = sessionStorage (cleared when
        // the tab closes) and the normal 60-minute token.
        var store = remember ? localStorage : sessionStorage;
        localStorage.removeItem('access_token'); sessionStorage.removeItem('access_token');
        store.setItem('access_token', res.access_token);
        store.setItem('username', username);
        showMsg('Signed in. Opening your workspace…', 'success');
        setTimeout(function(){ window.location.href = 'dashboard.html'; }, 400);
      })
      .catch(function(err){
        showMsg(typeof err === 'string' ? err : 'Incorrect username or password.', 'error');
        setLoading(btn, false);
      });
  });

  document.getElementById('registerForm').addEventListener('submit', function(e){
    e.preventDefault();
    hideMsg();
    var username = document.getElementById('regUsername').value.trim();
    var email = document.getElementById('regEmail').value.trim();
    var password = document.getElementById('regPassword').value;
    var btn = document.getElementById('registerSubmit');

    setLoading(btn, true);
    apiRegister(username, email, password)
      .then(function(){
        showTab('login');
        document.getElementById('loginUsername').value = username;
        document.getElementById('loginPassword').focus();
        showMsg('Account created. Enter your password to sign in.', 'success');
      })
      .catch(function(err){ showMsg(typeof err === 'string' ? err : 'Could not create account.', 'error'); })
      .then(function(){ setLoading(btn, false); });
  });

  // Backend status hint under the form
  var note = document.getElementById('apiNote');
  fetch(API_BASE + '/health')
    .then(function(r){ if (!r.ok) throw 0; note.classList.add('up'); note.lastChild.textContent = 'Backend online'; })
    .catch(function(){ note.classList.add('down'); note.lastChild.textContent = 'Backend offline: run uvicorn main:app --reload'; });
})();
</script>
</body>
</html>
