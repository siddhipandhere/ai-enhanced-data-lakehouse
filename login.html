<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — DataLake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* =========================================================
   RESET + TOKENS (shared with landing page)
========================================================= */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root{
  --bg:        #FAFAFA;
  --surface:   #FFFFFF;
  --border:    #E5E7EB;
  --border-strong: #D1D5DB;
  --text:      #111827;
  --text-muted:#6B7280;
  --text-faint:#9CA3AF;
  --blue:      #2563EB;
  --blue-dim:  #EFF4FF;
  --green:     #16A34A;
  --green-dim: #EEFBF2;
  --amber:     #D97706;
  --amber-dim: #FEF6E7;
  --red:       #DC2626;
  --red-dim:   #FEF2F2;

  --radius-sm: 6px;
  --radius:    8px;
  --radius-lg: 10px;

  --shadow-xs: 0 1px 2px rgba(17,24,39,0.04);
  --shadow-sm: 0 1px 3px rgba(17,24,39,0.06), 0 1px 2px rgba(17,24,39,0.04);
  --shadow-md: 0 8px 24px rgba(17,24,39,0.08);

  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}

html{ scroll-behavior:smooth; }

body{
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height:100vh;
}

a{ text-decoration:none; color:inherit; }
ul{ list-style:none; }
button{ cursor:pointer; font-family:var(--font-ui); border:none; outline:none; background:none; color:inherit; }
img,svg{ display:block; }
input{ font-family:var(--font-ui); }

.icon{ width:18px; height:18px; stroke:currentColor; stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

/* =========================================================
   BUTTONS
========================================================= */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  height: 42px;
  padding: 0 16px;
  font-size: 14px;
  font-weight: 550;
  border-radius: var(--radius-sm);
  transition: background .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease), opacity .15s var(--ease);
  white-space:nowrap;
  width:100%;
}
.btn svg{ width:14px; height:14px; }

.btn-dark{
  background: var(--text);
  color: #fff;
  border: 1px solid var(--text);
}
.btn-dark:hover{ background:#000; }
.btn-dark:disabled{ opacity:.55; cursor:default; }

.btn-outline{
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-strong);
}
.btn-outline:hover{ border-color:#9CA3AF; background:#FCFCFD; }

.btn-ghost{
  background:transparent;
  color: var(--text-muted);
  border:1px solid transparent;
}
.btn-ghost:hover{ color:var(--text); }

/* =========================================================
   TOP BAR (minimal)
========================================================= */
.topbar{
  height:64px;
  display:flex; align-items:center;
  padding: 0 28px;
}
.nav-logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  font-size:14.5px;
  letter-spacing:-0.01em;
  color: var(--text);
}
.nav-logo .mark{
  width:22px; height:22px;
  border-radius:5px;
  background: var(--text);
  display:flex; align-items:center; justify-content:center;
}
.nav-logo .mark svg{ width:13px; height:13px; }

/* =========================================================
   AUTH LAYOUT
========================================================= */
.auth-wrap{
  min-height: calc(100vh - 64px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 24px;
}

.auth-card{
  width:100%;
  max-width: 400px;
}

.auth-head{
  text-align:center;
  margin-bottom: 28px;
}
.auth-head .badge{
  width:44px; height:44px;
  border-radius:10px;
  background: var(--text);
  display:flex; align-items:center; justify-content:center;
  margin: 0 auto 18px;
}
.auth-head .badge svg{ width:22px; height:22px; stroke:#fff; }
.auth-head h1{
  font-size: 22px;
  font-weight:700;
  letter-spacing:-0.02em;
  margin-bottom:6px;
}
.auth-head p{
  font-size: 13.5px;
  color: var(--text-muted);
}

.tabs{
  display:flex;
  border:1px solid var(--border);
  border-radius: var(--radius);
  padding:3px;
  margin-bottom:22px;
  background:var(--surface);
}
.tab-btn{
  flex:1;
  height:32px;
  border-radius:6px;
  font-size:13px;
  font-weight:600;
  color:var(--text-muted);
  transition: background .15s var(--ease), color .15s var(--ease);
}
.tab-btn.active{
  background: var(--text);
  color:#fff;
}

.panel{
  border:1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  padding: 26px;
  box-shadow: var(--shadow-sm);
}

.panel-body{ display:none; }
.panel-body.active{ display:block; }

.field{ margin-bottom:16px; }
.field:last-of-type{ margin-bottom:0; }
.field label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  color:var(--text);
  margin-bottom:6px;
}
.field .input-wrap{ position:relative; }
.field .input-wrap .icon{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; color:var(--text-faint);
}
.field input{
  width:100%;
  height:40px;
  padding: 0 12px 0 36px;
  border:1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  color: var(--text);
  background: var(--surface);
  transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.field input::placeholder{ color:var(--text-faint); }
.field input:focus{ border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-dim); }
.field .hint{ font-size:11.5px; color:var(--text-faint); margin-top:5px; }

.field-row{ display:flex; align-items:center; justify-content:space-between; margin: 4px 0 18px; }
.field-row .remember{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-muted); }
.field-row .remember input{ width:14px; height:14px; accent-color:var(--text); }
.field-row a{ font-size:12.5px; color:var(--text); font-weight:600; }
.field-row a:hover{ text-decoration:underline; }

.submit-row{ margin-top: 20px; }

.divider{
  display:flex; align-items:center; gap:12px;
  margin: 20px 0;
  font-size:11.5px; color:var(--text-faint);
  text-transform:uppercase; letter-spacing:.04em;
}
.divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--border); }

.form-msg{
  display:none;
  align-items:center;
  gap:8px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  font-size:12.8px;
  margin-bottom:16px;
}
.form-msg.show{ display:flex; }
.form-msg.error{ background:var(--red-dim); color:var(--red); }
.form-msg.success{ background:var(--green-dim); color:var(--green); }
.form-msg .icon{ width:15px; height:15px; flex-shrink:0; }

.spinner{
  width:14px; height:14px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.35);
  border-top-color:#fff;
  animation: spin .6s linear infinite;
  display:none;
}
.btn.loading .spinner{ display:inline-block; }
.btn.loading .btn-label{ opacity:.85; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.auth-foot{
  text-align:center;
  margin-top: 18px;
  font-size:12.8px;
  color:var(--text-faint);
}
.auth-foot a{ color:var(--text); font-weight:600; }
.auth-foot a:hover{ text-decoration:underline; }

.back-home{
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; color:var(--text-muted);
}
.back-home:hover{ color:var(--text); }
.back-home .icon{ width:14px; height:14px; }

@media (max-width: 480px){
  .topbar{ padding: 0 18px; }
}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="nav-logo">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 18l9 4 9-4"/></svg>
    </span>
    DataLake
  </a>
</div>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-head">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 18l9 4 9-4"/></svg>
      </div>
      <h1 id="authTitle">Welcome back</h1>
      <p id="authSubtitle">Log in to your lakehouse workspace</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" type="button">Log in</button>
      <button class="tab-btn" id="tabRegister" type="button">Create account</button>
    </div>

    <div class="panel">

      <div id="formMsg" class="form-msg">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
        <span id="formMsgText"></span>
      </div>

      <!-- LOGIN -->
      <div class="panel-body active" id="panelLogin">
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="loginUsername">Username</label>
            <div class="input-wrap">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
              <input type="text" id="loginUsername" name="username" placeholder="your_username" autocomplete="username" required />
            </div>
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <div class="input-wrap">
              <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input type="password" id="loginPassword" name="password" placeholder="••••••••" autocomplete="current-password" required />
            </div>
          </div>

          <div class="field-row">
            <label class="remember">
              <input type="checkbox" id="rememberMe" />
              Remember me
            </label>
            <a href="#" id="forgotLink">Forgot password?</a>
          </div>

          <div class="submit-row">
            <button type="submit" class="btn btn-dark" id="loginSubmit">
              <span class="spinner"></span>
              <span class="btn-label">Log in</span>
            </button>
          </div>
        </form>
      </div>

      <!-- REGISTER -->
      <div class="panel-body" id="panelRegister">
        <form id="registerForm" novalidate>
          <div class="field">
            <label for="regUsername">Username</label>
            <div class="input-wrap">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
              <input type="text" id="regUsername" name="username" placeholder="your_username" autocomplete="username" minlength="3" maxlength="50" required />
            </div>
            <div class="hint">3–50 characters</div>
          </div>
          <div class="field">
            <label for="regEmail">Email</label>
            <div class="input-wrap">
              <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              <input type="email" id="regEmail" name="email" placeholder="you@example.com" autocomplete="email" required />
            </div>
          </div>
          <div class="field">
            <label for="regPassword">Password</label>
            <div class="input-wrap">
              <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input type="password" id="regPassword" name="password" placeholder="••••••••" autocomplete="new-password" minlength="8" required />
            </div>
            <div class="hint">Minimum 8 characters</div>
          </div>

          <div class="submit-row">
            <button type="submit" class="btn btn-dark" id="registerSubmit">
              <span class="spinner"></span>
              <span class="btn-label">Create account</span>
            </button>
          </div>
        </form>
      </div>

    </div>

    <div class="auth-foot" id="switchFoot">
      Don't have an account? <a href="#" id="switchToRegister">Sign up</a>
    </div>

    <div style="text-align:center; margin-top:26px;">
      <a href="index.html" class="back-home">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Back to home
      </a>
    </div>

  </div>
</div>

<script>
(function(){
  'use strict';

  /* ============================================================
     This is the front end only, running against mock/local logic.
     Swap the two functions below for real calls to:
       POST {API_BASE}/auth/login   { username, password }  -> { access_token, token_type }
       POST {API_BASE}/auth/register { username, email, password } -> user object
     Both are already scaffolded and just need the fetch() calls filled in.
  ============================================================ */
  var API_BASE = 'http://localhost:8000'; // FastAPI backend (uvicorn main:app --reload)

  var tabLogin = document.getElementById('tabLogin');
  var tabRegister = document.getElementById('tabRegister');
  var panelLogin = document.getElementById('panelLogin');
  var panelRegister = document.getElementById('panelRegister');
  var authTitle = document.getElementById('authTitle');
  var authSubtitle = document.getElementById('authSubtitle');
  var switchFoot = document.getElementById('switchFoot');
  var switchToRegister = document.getElementById('switchToRegister');
  var formMsg = document.getElementById('formMsg');
  var formMsgText = document.getElementById('formMsgText');

  function showTab(which){
    var isLogin = which === 'login';
    tabLogin.classList.toggle('active', isLogin);
    tabRegister.classList.toggle('active', !isLogin);
    panelLogin.classList.toggle('active', isLogin);
    panelRegister.classList.toggle('active', !isLogin);
    authTitle.textContent = isLogin ? 'Welcome back' : 'Create your account';
    authSubtitle.textContent = isLogin ? 'Log in to your lakehouse workspace' : 'Start ingesting and querying your data';
    switchFoot.innerHTML = isLogin
      ? 'Don\'t have an account? <a href="#" id="switchToRegister">Sign up</a>'
      : 'Already have an account? <a href="#" id="switchToLogin">Log in</a>';
    hideMsg();
    bindSwitchLinks();
  }

  function bindSwitchLinks(){
    var toReg = document.getElementById('switchToRegister');
    var toLogin = document.getElementById('switchToLogin');
    if (toReg) toReg.addEventListener('click', function(e){ e.preventDefault(); showTab('register'); });
    if (toLogin) toLogin.addEventListener('click', function(e){ e.preventDefault(); showTab('login'); });
  }

  tabLogin.addEventListener('click', function(){ showTab('login'); });
  tabRegister.addEventListener('click', function(){ showTab('register'); });
  bindSwitchLinks();

  function showMsg(text, type){
    formMsgText.textContent = text;
    formMsg.className = 'form-msg show ' + type;
  }
  function hideMsg(){
    formMsg.className = 'form-msg';
  }

  function setLoading(btn, loading){
    btn.classList.toggle('loading', loading);
    btn.disabled = loading;
  }

  /* ---- Real auth calls against the FastAPI backend ---- */
  function parseError(res, fallback){
    return res.json().catch(function(){ return null; }).then(function(body){
      if (body && body.detail){
        // FastAPI validation errors come back as an array of {msg, loc}
        if (Array.isArray(body.detail)) return body.detail.map(function(d){ return d.msg; }).join(' ');
        return body.detail;
      }
      return fallback;
    });
  }

  function apiLogin(username, password){
    if (!username || !password) return Promise.reject('Enter your username and password.');
    return fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    }).then(function(res){
      if (!res.ok) return parseError(res, 'Incorrect username or password.').then(function(msg){ throw msg; });
      return res.json(); // { access_token, token_type }
    }).catch(function(err){
      if (typeof err === 'string') throw err;
      throw 'Could not reach the backend at ' + API_BASE + '. Is uvicorn running?';
    });
  }

  function apiRegister(username, email, password){
    return fetch(API_BASE + '/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, email: email, password: password })
    }).then(function(res){
      if (!res.ok) return parseError(res, 'Could not create account.').then(function(msg){ throw msg; });
      return res.json(); // UserOut
    }).catch(function(err){
      if (typeof err === 'string') throw err;
      throw 'Could not reach the backend at ' + API_BASE + '. Is uvicorn running?';
    });
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    hideMsg();
    var username = document.getElementById('loginUsername').value.trim();
    var password = document.getElementById('loginPassword').value;
    var btn = document.getElementById('loginSubmit');

    setLoading(btn, true);
    apiLogin(username, password)
      .then(function(res){
        localStorage.setItem('access_token', res.access_token);
        localStorage.setItem('username', username);
        showMsg('Logged in — redirecting…', 'success');
        setTimeout(function(){ window.location.href = 'dashboard.html'; }, 500);
      })
      .catch(function(err){
        showMsg(typeof err === 'string' ? err : 'Incorrect username or password.', 'error');
        setLoading(btn, false);
      });
  });

  document.getElementById('registerForm').addEventListener('submit', function(e){
    e.preventDefault();
    hideMsg();
    var username = document.getElementById('regUsername').value.trim();
    var email = document.getElementById('regEmail').value.trim();
    var password = document.getElementById('regPassword').value;
    var btn = document.getElementById('registerSubmit');

    setLoading(btn, true);
    apiRegister(username, email, password)
      .then(function(res){
        showMsg('Account created — you can log in now.', 'success');
        setTimeout(function(){ showTab('login'); }, 900);
      })
      .catch(function(err){
        showMsg(typeof err === 'string' ? err : 'Could not create account.', 'error');
      })
      .finally(function(){ setLoading(btn, false); });
  });

})();
</script>

</body>
</html>
